name: Elixir CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: '1.15.8'
            otp: '26.2'
          - elixir: '1.19.6'
            otp: '27.3'
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix format --check-formatted
      - run: mix test --warnings-as-errors --cover

  package:
    name: Check style, types, docs, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.6'
          otp-version: '27.3'
      - run: mix deps.get
      - run: mix credo --all --strict --ignore todo
      - run: mix credo --all --strict -C test
      - run: mix doctor --failed
      - run: mix dialyzer
      - run: mix docs --warnings-as-errors
      - run: mix hex.build
